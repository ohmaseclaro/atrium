name: Deploy demo (demo.atriumjs.dev)

on:
  push:
    branches:
      - main
    paths:
      - "packages/demo/**"
      - "packages/core/**"
      - "packages/express/**"
      - "packages/react/**"
      - "packages/protocol/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "tsconfig.base.json"
      - "deploy/**"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

concurrency:
  group: atrium-deploy-demo
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint, test, and build
        run: pnpm lint && pnpm test && pnpm build

  deploy:
    name: Deploy via SSH
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://demo.atriumjs.dev

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        id: ssh-deploy
        uses: appleboy/ssh-action@v1.0.0
        continue-on-error: true
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: false
          timeout: 120s
          command_timeout: 45m
          script: |
            set -eo pipefail
            echo "🚀 Atrium demo deploy…"
            DEPLOY_DIR="${{ secrets.ATRIUM_DEPLOY_DIR }}"
            D="${DEPLOY_DIR:-/home/atrium}"
            cd "$D"

            echo "🧹 Light disk hygiene (dangling images only)…"
            sudo docker image prune -f >/dev/null 2>&1 || true

            echo "📝 Running deploy/update-demo.sh…"
            if ! ./deploy/update-demo.sh 2>&1 | tee /tmp/atrium-demo-deploy.log; then
              echo "❌ update-demo.sh failed — tail:"
              tail -80 /tmp/atrium-demo-deploy.log
              exit 1
            fi
            echo "✅ update-demo.sh finished"

      - name: Retry deploy (SSH flake)
        if: steps.ssh-deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: false
          timeout: 120s
          command_timeout: 45m
          script: |
            set -eo pipefail
            echo "🔄 Retry Atrium demo deploy…"
            DEPLOY_DIR="${{ secrets.ATRIUM_DEPLOY_DIR }}"
            D="${DEPLOY_DIR:-/home/atrium}"
            cd "$D"
            sudo docker image prune -f >/dev/null 2>&1 || true
            if ! ./deploy/update-demo.sh 2>&1 | tee /tmp/atrium-demo-deploy-retry.log; then
              tail -80 /tmp/atrium-demo-deploy-retry.log
              exit 1
            fi

      - name: Verify loopback health
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: false
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.ATRIUM_DEPLOY_DIR }}"
            D="${DEPLOY_DIR:-/home/atrium}"
            ENV_FILE="$D/deploy/atrium-demo.env"
            PORT=7341
            if [ -f "$ENV_FILE" ]; then
              LINE=$(grep -E '^PORT=' "$ENV_FILE" | tail -1 || true)
              if [ -n "$LINE" ]; then
                PORT="${LINE#PORT=}"
                PORT="${PORT//\"/}"
                PORT="${PORT//\'/}"
                PORT="${PORT// /}"
              fi
            fi
            PORT="${PORT:-7341}"
            echo "🔍 Health on 127.0.0.1:$PORT/atrium/healthz …"
            for i in $(seq 1 15); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://127.0.0.1:${PORT}/atrium/healthz" || true)
              CODE=${CODE:-000}
              if [ "$CODE" = "200" ]; then
                echo "✅ OK (HTTP $CODE) after $i attempt(s)"
                exit 0
              fi
              echo "⏳ HTTP $CODE — attempt $i/15, sleep 5s"
              sleep 5
            done
            echo "❌ Health check failed"
            exit 1

      - name: Summary (success)
        if: success()
        run: |
          echo "✅ Demo deployed — https://demo.atriumjs.dev"
          echo "Commit: ${{ github.sha }}"

      - name: Summary (failure)
        if: failure()
        run: |
          echo "❌ Demo deploy failed — see SSH logs and /tmp/atrium-demo-deploy.log on the server"

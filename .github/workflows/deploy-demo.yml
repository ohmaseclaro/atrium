name: Deploy landing + demo (atriumjs.dev)

on:
  push:
    branches:
      - main
    paths:
      - "packages/demo/**"
      - "packages/core/**"
      - "packages/express/**"
      - "packages/react/**"
      - "packages/protocol/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "tsconfig.base.json"
      - "deploy/**"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

concurrency:
  group: atrium-deploy-sites
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint, test, and build
        run: pnpm lint && pnpm test && pnpm build

  deploy:
    name: Deploy via SSH
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://atriumjs.dev

    steps:
      - uses: actions/checkout@v4

      - name: Check SSH secrets are configured
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          missing=0
          if [ -z "$SSH_HOST" ]; then
            echo "::error::SSH_HOST is empty. Add a repository or **demo** environment secret (Settings → Secrets and variables → Actions). Value = your VPS IP or DNS name — do not commit it to the repo."
            missing=1
          fi
          if [ -z "$SSH_USER" ]; then
            echo "::error::SSH_USER is empty. Add it next to SSH_HOST (e.g. deploy)."
            missing=1
          fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY is empty. Add the private deploy key (PEM) as a secret."
            missing=1
          fi
          exit "$missing"

      - name: Deploy to VPS
        id: ssh-deploy
        uses: appleboy/ssh-action@v1.0.0
        continue-on-error: true
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: false
          # appleboy: timeout = SSH dial / session wait (was 120s → flaky "dial tcp i/o timeout")
          timeout: 10m
          command_timeout: 60m
          script: |
            set -eo pipefail
            echo "🚀 Atrium demo deploy…"
            DEPLOY_DIR="${{ secrets.ATRIUM_DEPLOY_DIR }}"
            D="${DEPLOY_DIR:-/home/atrium}"
            cd "$D"

            echo "🧹 Light disk hygiene (dangling images only)…"
            sudo docker image prune -f >/dev/null 2>&1 || true

            echo "📝 Running deploy/update-demo.sh…"
            if ! ./deploy/update-demo.sh 2>&1 | tee /tmp/atrium-demo-deploy.log; then
              echo "❌ update-demo.sh failed — tail:"
              tail -80 /tmp/atrium-demo-deploy.log
              exit 1
            fi
            echo "✅ update-demo.sh finished"

            ENV_FILE="$D/deploy/atrium-demo.env"
            PORT=7341
            WORKER_HTTP_PORT=7070
            if [ -f "$ENV_FILE" ]; then
              LINE=$(grep -E '^PORT=' "$ENV_FILE" | tail -1 || true)
              if [ -n "$LINE" ]; then
                PORT="${LINE#PORT=}"
                PORT="${PORT//\"/}"
                PORT="${PORT//\'/}"
                PORT="${PORT// /}"
              fi
              DIAL=$(grep -E '^ATRIUM_WORKER_DIAL_BASE=' "$ENV_FILE" | tail -1 || true)
              if [ -n "$DIAL" ]; then
                DIAL="${DIAL#ATRIUM_WORKER_DIAL_BASE=}"
                DIAL="${DIAL//\"/}"
                DIAL="${DIAL//\'/}"
                if [[ "$DIAL" =~ :([0-9]+)$ ]]; then
                  WORKER_HTTP_PORT="${BASH_REMATCH[1]}"
                fi
              fi
            fi
            PORT="${PORT:-7341}"

            echo "🔍 Demo GET http://127.0.0.1:${PORT}/atrium/healthz …"
            for i in $(seq 1 24); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://127.0.0.1:${PORT}/atrium/healthz" || true)
              CODE=${CODE:-000}
              if [ "$CODE" = "200" ]; then
                echo "✅ Demo OK (HTTP $CODE) after $i attempt(s)"
                break
              fi
              echo "⏳ Demo HTTP $CODE — attempt $i/24, sleep 5s"
              sleep 5
            done
            if [ "${CODE:-000}" != "200" ]; then
              echo "❌ Demo health check failed"
              exit 1
            fi

            echo "🔍 Worker GET http://127.0.0.1:${WORKER_HTTP_PORT}/healthz …"
            for i in $(seq 1 40); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://127.0.0.1:${WORKER_HTTP_PORT}/healthz" || true)
              CODE=${CODE:-000}
              if [ "$CODE" = "200" ]; then
                echo "✅ Worker OK (HTTP $CODE) after $i attempt(s)"
                break
              fi
              echo "⏳ Worker HTTP $CODE — attempt $i/40, sleep 5s"
              sleep 5
            done
            if [ "${CODE:-000}" != "200" ]; then
              echo "❌ Worker health check failed — ensure deploy user can run Docker (docker group) and deploy/atrium-demo.env exists"
              exit 1
            fi

            echo "🔍 Landing GET / (HTTPS SNI atriumjs.dev → 127.0.0.1:443) …"
            for i in $(seq 1 15); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 \
                --resolve atriumjs.dev:443:127.0.0.1 \
                "https://atriumjs.dev/" || true)
              CODE=${CODE:-000}
              if [ "$CODE" = "200" ]; then
                echo "✅ Landing OK (HTTPS $CODE) after $i attempt(s)"
                exit 0
              fi
              echo "⏳ Landing HTTP $CODE — attempt $i/15, sleep 3s"
              sleep 3
            done
            echo "❌ Landing check failed"
            exit 1

      - name: Retry deploy (SSH flake)
        if: steps.ssh-deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: false
          timeout: 10m
          command_timeout: 60m
          script: |
            set -eo pipefail
            echo "🔄 Retry Atrium demo deploy…"
            DEPLOY_DIR="${{ secrets.ATRIUM_DEPLOY_DIR }}"
            D="${DEPLOY_DIR:-/home/atrium}"
            cd "$D"
            sudo docker image prune -f >/dev/null 2>&1 || true
            if ! ./deploy/update-demo.sh 2>&1 | tee /tmp/atrium-demo-deploy-retry.log; then
              tail -80 /tmp/atrium-demo-deploy-retry.log
              exit 1
            fi
            ENV_FILE="$D/deploy/atrium-demo.env"
            PORT=7341
            WORKER_HTTP_PORT=7070
            if [ -f "$ENV_FILE" ]; then
              LINE=$(grep -E '^PORT=' "$ENV_FILE" | tail -1 || true)
              if [ -n "$LINE" ]; then
                PORT="${LINE#PORT=}"
                PORT="${PORT//\"/}"
                PORT="${PORT//\'/}"
                PORT="${PORT// /}"
              fi
              DIAL=$(grep -E '^ATRIUM_WORKER_DIAL_BASE=' "$ENV_FILE" | tail -1 || true)
              if [ -n "$DIAL" ]; then
                DIAL="${DIAL#ATRIUM_WORKER_DIAL_BASE=}"
                DIAL="${DIAL//\"/}"
                DIAL="${DIAL//\'/}"
                if [[ "$DIAL" =~ :([0-9]+)$ ]]; then
                  WORKER_HTTP_PORT="${BASH_REMATCH[1]}"
                fi
              fi
            fi
            PORT="${PORT:-7341}"
            for i in $(seq 1 24); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://127.0.0.1:${PORT}/atrium/healthz" || true)
              CODE=${CODE:-000}
              [ "$CODE" = "200" ] && break
              sleep 5
            done
            [ "${CODE:-000}" = "200" ] || { echo "❌ Demo health failed"; exit 1; }
            for i in $(seq 1 40); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://127.0.0.1:${WORKER_HTTP_PORT}/healthz" || true)
              CODE=${CODE:-000}
              [ "$CODE" = "200" ] && break
              sleep 5
            done
            [ "${CODE:-000}" = "200" ] || { echo "❌ Worker health failed"; exit 1; }
            for i in $(seq 1 15); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 \
                --resolve atriumjs.dev:443:127.0.0.1 \
                "https://atriumjs.dev/" || true)
              CODE=${CODE:-000}
              [ "$CODE" = "200" ] && exit 0
              sleep 3
            done
            echo "❌ Landing check failed"
            exit 1

      - name: Summary (success)
        if: success()
        run: |
          echo "✅ Deployed — https://atriumjs.dev (landing) · https://demo.atriumjs.dev (demo)"
          echo "Commit: ${{ github.sha }}"

      - name: Summary (failure)
        if: failure()
        run: |
          echo "❌ Deploy failed — see SSH logs, /tmp/atrium-demo-deploy.log, and journalctl -u atrium-demo on the server"

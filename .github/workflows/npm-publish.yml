# Publishes public @atriumjs/atrium-* packages in dependency order.
# Configure repository secret NPM_TOKEN (see docs/npm-publishing.md).

name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install and verify
        run: pnpm install --frozen-lockfile && pnpm publish:check

      - name: Publish packages (order matters)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          for dir in packages/protocol packages/server packages/react packages/worker packages/cli; do
            (cd "$dir" && npm publish --access public)
          done

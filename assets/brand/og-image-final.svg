<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!--
    Final OG / social-share card for Atrium.
    Composes the AI-generated atmospheric background (og-base-v3.png) with a
    pixel-perfect SVG type overlay. Render to PNG via:
      rsvg-convert -w 1200 og-image-final.svg -o og-image-final.png
    or any SVG-to-PNG tool (Inkscape, Figma export, sharp + Node).
  -->
  <defs>
    <linearGradient id="leftGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b0d12" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#0b0d12" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Atmospheric AI background (relative path so it stays portable). -->
  <image href="generated/og-base-v3.png" x="0" y="0" width="1200" height="630" preserveAspectRatio="xMidYMid slice"/>

  <!-- Soft left vignette so type stays legible regardless of background variation. -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#leftGradient)"/>

  <!-- Brand wordmark + tagline (left-aligned in the negative-space half). -->
  <g transform="translate(72, 232)">
    <!-- Brand mark (matches packages/react/src/index.tsx control-pill cyan #22d3ee). -->
    <g transform="scale(1.6)">
      <path
        d="M12 56 V32 C12 20.954 20.954 12 32 12 C43.046 12 52 20.954 52 32 V56"
        stroke="#22d3ee" stroke-width="6" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="9" y1="56" x2="55" y2="56"
        stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text x="120" y="80"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-weight="800" font-size="120" fill="#f9fafb" letter-spacing="-3">atrium</text>
  </g>

  <text x="72" y="402"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="500" font-size="32" fill="#cbd5e1" letter-spacing="-0.5">Open-source remote browser</text>
  <text x="72" y="442"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="500" font-size="32" fill="#cbd5e1" letter-spacing="-0.5">for OAuth, MFA &amp; captcha handoff.</text>

  <!-- Bottom strip: repo + license + install one-liner. -->
  <text x="72" y="558"
    font-family="Inter, ui-sans-serif, system-ui, sans-serif"
    font-weight="600" font-size="20" fill="#22d3ee">github.com/ohmaseclaro/atrium</text>
  <text x="380" y="558"
    font-family="Inter, ui-sans-serif, system-ui, sans-serif"
    font-weight="500" font-size="20" fill="#64748b">·</text>
  <text x="402" y="558"
    font-family="Inter, ui-sans-serif, system-ui, sans-serif"
    font-weight="500" font-size="20" fill="#94a3b8">MIT</text>
  <text x="448" y="558"
    font-family="Inter, ui-sans-serif, system-ui, sans-serif"
    font-weight="500" font-size="20" fill="#64748b">·</text>
  <text x="470" y="558"
    font-family="Inter, ui-sans-serif, system-ui, sans-serif"
    font-weight="500" font-size="20" fill="#94a3b8">npm i @atriumjs/express @atriumjs/react @atriumjs/worker</text>
</svg>

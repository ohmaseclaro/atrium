<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!--
    Open Graph social preview (1200×630).
    Used when the GitHub repo / atriumjs.dev is shared on X, LinkedIn, Slack, Discord.
    Centered atrium wordmark + tagline. Subtle radial accent bottom-right.
  -->
  <defs>
    <radialGradient id="accent" cx="85%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0b0d12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1119"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#accent)"/>

  <!-- Subtle grid lines for depth -->
  <g stroke="#1e2530" stroke-width="1" opacity="0.6">
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="470" x2="1200" y2="470"/>
  </g>

  <!-- Centered lockup -->
  <g transform="translate(140,225)">
    <!-- Mark -->
    <g transform="scale(2.4)">
      <path
        d="M12 56 V32 C12 20.954 20.954 12 32 12 C43.046 12 52 20.954 52 32 V56"
        stroke="#22d3ee"
        stroke-width="6"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <line
        x1="9"
        y1="56"
        x2="55"
        y2="56"
        stroke="#22d3ee"
        stroke-width="6"
        stroke-linecap="round"
      />
    </g>
    <!-- Wordmark -->
    <text
      x="190"
      y="120"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-weight="800"
      font-size="148"
      fill="#f9fafb"
      letter-spacing="-3"
    >atrium</text>
  </g>

  <!-- Tagline -->
  <text
    x="140"
    y="430"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="500"
    font-size="36"
    fill="#cbd5e1"
    letter-spacing="-0.5"
  >Open-source remote browser for OAuth, MFA &amp; captcha handoff.</text>

  <!-- Subtagline -->
  <text
    x="140"
    y="478"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="400"
    font-size="22"
    fill="#94a3b8"
    letter-spacing="-0.2"
  >Stream a real Chromium session into your React app. Hand control to a human. Resume automation.</text>

  <!-- Bottom strip -->
  <g transform="translate(140,548)">
    <text
      font-family="Inter, ui-sans-serif, system-ui, sans-serif"
      font-weight="600"
      font-size="20"
      fill="#22d3ee"
    >github.com/ohmaseclaro/atrium</text>
    <text
      x="380"
      font-family="Inter, ui-sans-serif, system-ui, sans-serif"
      font-weight="500"
      font-size="20"
      fill="#64748b"
    >·</text>
    <text
      x="402"
      font-family="Inter, ui-sans-serif, system-ui, sans-serif"
      font-weight="500"
      font-size="20"
      fill="#94a3b8"
    >MIT</text>
    <text
      x="448"
      font-family="Inter, ui-sans-serif, system-ui, sans-serif"
      font-weight="500"
      font-size="20"
      fill="#64748b"
    >·</text>
    <text
      x="470"
      font-family="Inter, ui-sans-serif, system-ui, sans-serif"
      font-weight="500"
      font-size="20"
      fill="#94a3b8"
    >npm install @atriumjs/express @atriumjs/react @atriumjs/worker</text>
  </g>
</svg>

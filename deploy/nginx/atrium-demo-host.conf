# Host-side nginx vhost for the Atrium public demo on a multi-tenant box
# (same pattern as Capitanias: Cloudflare in front, nginx HTTP → loopback).
#
# Placeholder __ATRIUM_DEMO_PORT__ is replaced by deploy/update-demo.sh from
# deploy/atrium-demo.env (PORT=) when syncing to /etc/nginx/sites-available/.

upstream atrium_demo_upstream {
    server 127.0.0.1:__ATRIUM_DEMO_PORT__;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name demo.atriumjs.dev;

    client_max_body_size 25m;

    access_log /var/log/nginx/atrium-demo.access.log;
    error_log  /var/log/nginx/atrium-demo.error.log;

    real_ip_header CF-Connecting-IP;

    location ~ ^/atrium/sessions/[^/]+/stream {
        proxy_pass http://atrium_demo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }

    location / {
        proxy_pass http://atrium_demo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}

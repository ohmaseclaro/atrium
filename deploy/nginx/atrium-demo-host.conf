# Host-side nginx vhost for the Atrium public demo on a multi-tenant box.
# Cloudflare "Full" hits origin :443 — see atrium-landing-host.conf header for TLS.
#
# Placeholder __ATRIUM_DEMO_PORT__ is replaced by deploy/update-demo.sh from
# deploy/atrium-demo.env (PORT=).

upstream atrium_demo_upstream {
    server 127.0.0.1:__ATRIUM_DEMO_PORT__;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name demo.atriumjs.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.atriumjs.dev;

    ssl_certificate     /etc/letsencrypt/live/atriumjs.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atriumjs.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    access_log /var/log/nginx/atrium-demo.access.log;
    error_log  /var/log/nginx/atrium-demo.error.log;

    real_ip_header CF-Connecting-IP;

    location ~ ^/atrium/sessions/[^/]+/stream {
        proxy_pass http://atrium_demo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }

    location / {
        proxy_pass http://atrium_demo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}

# Static marketing site — atriumjs.dev (repo: deploy/landing/index.html)
# Placeholder __ATRIUM_REPO_ROOT__ is replaced by deploy/update-demo.sh.
#
# Cloudflare "Full" / "Full (strict)" connects to origin on :443. Obtain TLS
# first (same SAN as demo is fine), e.g.:
#   certbot certonly --nginx -d atriumjs.dev -d www.atriumjs.dev -d demo.atriumjs.dev
# Paths below match that certificate name "atriumjs.dev".

server {
    listen 80;
    listen [::]:80;
    server_name atriumjs.dev www.atriumjs.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name atriumjs.dev www.atriumjs.dev;

    ssl_certificate     /etc/letsencrypt/live/atriumjs.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atriumjs.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/atrium-landing.access.log;
    error_log  /var/log/nginx/atrium-landing.error.log;

    real_ip_header CF-Connecting-IP;

    if ($host = www.atriumjs.dev) {
        return 301 https://atriumjs.dev$request_uri;
    }

    root __ATRIUM_REPO_ROOT__/deploy/landing;
    index index.html;

    location = /index.html {
        add_header Cache-Control "public, max-age=300";
    }

    # Long-cache the immutable assets we sync into /img/* on every deploy.
    # Filename-version a derivative if its content changes.
    location /img/ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Serve real files; return real 404s for missing assets.
    # The previous fallback (`try_files $uri $uri/ /index.html;`) made nginx
    # answer 200 + text/html for any missing file — which silently broke
    # OG/Twitter card scrapers because they fetched the meta-tagged image
    # URL and got HTML back. The landing is a single static HTML file, not
    # an SPA, so a real 404 is the correct answer.
    location / {
        try_files $uri $uri/ =404;
    }
}

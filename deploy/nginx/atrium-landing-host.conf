# Static marketing site — atriumjs.dev (repo: deploy/landing/index.html)
# Placeholder __ATRIUM_REPO_ROOT__ is replaced by deploy/update-demo.sh with
# the absolute clone path (e.g. /home/atrium).

server {
    listen 80;
    listen [::]:80;
    server_name atriumjs.dev www.atriumjs.dev;

    access_log /var/log/nginx/atrium-landing.access.log;
    error_log  /var/log/nginx/atrium-landing.error.log;

    real_ip_header CF-Connecting-IP;

    if ($host = www.atriumjs.dev) {
        return 301 https://atriumjs.dev$request_uri;
    }

    root __ATRIUM_REPO_ROOT__/deploy/landing;
    index index.html;

    location = /index.html {
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
